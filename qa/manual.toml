# 人工检查清单：自动测试顾不到的 App 兼容性和观感，每次发版前过一遍。
# cargo xtask qa --release（或 --manual）会逐项提示，结果写进报告。
# 测之前先在对应的 App 里切到 Kyme 拼音。发现新的兼容性问题，就在这里加一项。

[[check]]
app = "备忘录"
steps = "新建一条备忘录，输入 nihao 按空格，再输入 women 按回车"
expect = "先上屏「你好」，再上屏字母 women；候选窗贴在输入行正下方"

[[check]]
app = "鼠标点候选"
steps = "在备忘录里输入 nihao，用鼠标点「你」，再点「好」；再输入 ni，点 › 翻到下一页、点 ‹ 翻回来，再点第一个候选"
expect = "点「你」之后输入框是「你hao」、候选窗还在，接着点「好」上屏「你好」；翻页时候选窗不消失；备忘录的输入框不失焦、光标不跳；变灰的箭头点了没反应"

[[check]]
app = "Safari"
steps = "在地址栏和任意网页的输入框里，各先打几个字上屏，再输入 nihao 按 5 次退格"
expect = "退格只删拼音，删光后输入结束；之前上屏的字一个都没少"

[[check]]
app = "Chrome"
steps = "在地址栏和任意网页的输入框里，各先打几个字上屏，再输入 nihao 按 5 次退格，最后输入 shijie 按空格"
expect = "退格只删拼音、不删前面的字（Chromium 会先把退格交给网页，最容易出这个问题）；最后上屏「世界」"

[[check]]
app = "VS Code"
steps = "在编辑器里输入 woshizhongguoren 按空格，再换一行输入 nihao 按回车"
expect = "上屏「我是中国人」和字母 nihao；候选窗一直跟着光标，不会停在窗口角落"

[[check]]
app = "终端 / iTerm2"
steps = "输入 nihao 后按 Esc，再输入 nihao 按空格"
expect = "输入过程中终端里不会冒出原样的字母；Esc 后什么都不留；最后上屏「你好」"

[[check]]
app = "微信"
steps = "在聊天输入框里输入 nihao 按回车"
expect = "只上屏字母 nihao，消息没有被发出去；再按一次回车才发送"

[[check]]
app = "飞书"
steps = "在聊天输入框里输入 nihao 按回车"
expect = "只上屏字母 nihao，消息没有被发出去"

[[check]]
app = "JetBrains IDE"
steps = "在编辑器里输入 nihao 按空格"
expect = "上屏「你好」，候选窗在光标旁边"

[[check]]
app = "Spotlight"
steps = "按 ⌘空格 打开 Spotlight，输入 nihao"
expect = "候选窗显示在 Spotlight 输入框下方，没有被挡住"

[[check]]
app = "密码框"
steps = "在任意网页的密码框里输入几个字母"
expect = "不弹出候选窗，字母直接输入（系统在密码框里会临时停用输入法）"

[[check]]
app = "屏幕边缘、多显示器、全屏"
steps = "把输入光标放到屏幕最下方再输入；再到副屏和全屏 App 里各输入一次"
expect = "下方放不下时候选窗翻到输入行上方、不超出屏幕；候选窗总在光标所在的那块屏幕上"

[[check]]
app = "浅色 / 深色模式"
steps = "分别在浅色和深色模式下输入 nihao"
expect = "候选窗和设置窗口的文字清楚；菜单栏的 Kyme 图标在两种模式下都看得清，边缘平滑没有锯齿（内置屏和外接屏都看一下）"

[[check]]
app = "中英切换提示"
steps = "轻点一下 Shift，马上打几个字母；再轻点一下 Shift"
expect = "光标旁依次显示「英」「中」，接着打字也不消失，约 1.5 秒后才收起；中英状态跟着切换"

[[check]]
app = "设置窗口"
steps = "点菜单栏的输入法图标，选「Kyme 设置…」；左边导航栏挨个点一遍；「输入」页每页候选改成 10，「外观」页高亮色选绿色、字号点大几下；回到备忘录输入 ni 再按 0。设置窗口开着时从 Spotlight 打开 Kyme，最后按 ⌘W"
expect = "设置窗口出现在最前面，每一页都显示得全，放不下的能滚动；预览跟着变；备忘录里每页 10 个、按 0 选中第 10 个、高亮是绿色、字变大；从 Spotlight 打开只把设置窗口叫到前面，不多开；⌘W 关掉窗口；settings.toml 里的注释还在"

[[check]]
app = "设置文件"
steps = "把 ~/Library/Application Support/Kyme/settings.toml 的 page_size 改成 6，保存后切换一下输入框，输入 ni；再把文件改坏（比如删掉一个 ]）后打开设置窗口"
expect = "候选变成每页 6 个；文件改坏时设置窗口标题下面用红字说哪一行错了，点选项不会覆盖文件；改回去后恢复"

[[check]]
app = "选词记忆"
steps = "在备忘录里打 ji，选第 5 个候选，重复 3 次后再打 ji；打 nihao，先选「拟」再选「号」，再打 nihao；最后在设置窗口点两次「清除」，切回备忘录再打 ji"
expect = "第 5 个候选升到首位；「拟号」出现在 nihao 的候选里；清除后恢复原来的顺序"

[[check]]
app = "自定义词库"
steps = "在设置窗口点「自定义词库」，用 Kyme 在输入框里打「鲲鹏」回车，再打「曾小贤 zengxiaoxian」点「添加」；切回备忘录打 kunpeng、zengxiaoxian、kp；回设置窗口删掉「鲲鹏」，切回备忘录再打 kunpeng"
expect = "输入框里能正常组字、选字；列表里新加的在最上面，读音是 kun peng、zeng xiao xian；三个输入都能打出加的词；删掉后 kunpeng 不再出「鲲鹏」"

[[check]]
app = "外部词库"
steps = "在设置窗口的「外部词库」页点「导入…」，选一个搜狗细胞词库（.scel）；切回备忘录打里面的一个生僻词；再回设置窗口点两次这个词库的「删除」，切回备忘录再打一次"
expect = "列表里出现这个词库和词数；生僻词能打出来；删除后列表里没有了，这个词也打不出来了"

[[check]]
app = "AI 预测选词"
steps = "在设置窗口的「AI」页选好服务商、填好 Key，点「检查一下」，再打开「AI 预测选词」；在备忘录里先写「周末想去夜市吃点」，再打 meishi 停一下；再打一遍，这次 ✨ 一出来就马上按空格；最后新建一条空备忘录，打 nihao 停一下"
expect = "「检查一下」说能用；停顿后半秒内首选变成「✨美食」，原来的「没事」排第二，按空格上屏「美食」；✨ 刚出来就按空格时上屏的是原来的首选；空备忘录里首选「你好」也标上 ✨；关掉 AI 预测选词后不再出 ✨"

[[check]]
app = "熄屏唤醒"
steps = "Kyme 是当前输入法时让屏幕熄灭并锁屏，唤醒解锁后直接在备忘录里打字，再轻点一下 Shift"
expect = "不用点任何东西就能打字，Shift 能切中英"
