# 人工检查清单：自动测试无法覆盖的 App 兼容性和显示效果，每次发版前逐项检查。
# cargo xtask qa --release（或 --manual）会逐项提示，结果写入报告。
# 检查前先在对应的 App 中切换到 Kyme 拼音。发现新的兼容性问题时，在此添加一项。

[[check]]
app = "备忘录"
steps = "新建一条备忘录，输入 nihao 后按空格，再输入 women 后按回车"
expect = "先上屏「你好」，再上屏字母 women；候选窗位于输入行正下方"

[[check]]
app = "鼠标点选候选"
steps = "在备忘录中输入 nihao，用鼠标依次点击「你」和「好」；再输入 ni，点击 › 翻到下一页、点击 ‹ 翻回，然后点击第一个候选"
expect = "点击「你」后输入框显示「你hao」且候选窗保留，再点击「好」上屏「你好」；翻页时候选窗不消失；备忘录输入框不失焦，光标位置不变；灰色箭头点击无效"

[[check]]
app = "Safari"
steps = "分别在地址栏和任一网页的输入框中先输入并上屏几个字，再输入 nihao，按 5 次退格"
expect = "退格只删除拼音，拼音删完后输入结束；此前上屏的文字完整保留"

[[check]]
app = "Chrome"
steps = "分别在地址栏和任一网页的输入框中先输入并上屏几个字，再输入 nihao，按 5 次退格，最后输入 shijie 后按空格"
expect = "退格只删除拼音，不删除此前的文字（Chromium 会先将退格交给网页，此问题最易出现）；最后上屏「世界」"

[[check]]
app = "VS Code"
steps = "在编辑器中输入 woshizhongguoren 后按空格，换行后输入 nihao 并按回车"
expect = "上屏「我是中国人」和字母 nihao；候选窗始终跟随光标，不停留在窗口角落"

[[check]]
app = "终端 / iTerm2"
steps = "输入 nihao 后按 Esc，再输入 nihao 后按空格"
expect = "输入过程中终端不出现原始字母；按 Esc 后不留任何内容；最后上屏「你好」"

[[check]]
app = "微信"
steps = "在聊天输入框中输入 nihao 后按回车"
expect = "仅上屏字母 nihao，消息未发送；再按一次回车才发送"

[[check]]
app = "飞书"
steps = "在聊天输入框中输入 nihao 后按回车"
expect = "仅上屏字母 nihao，消息未发送"

[[check]]
app = "JetBrains IDE"
steps = "在编辑器中输入 nihao 后按空格"
expect = "上屏「你好」，候选窗位于光标旁"

[[check]]
app = "Spotlight"
steps = "按 ⌘空格 打开 Spotlight，输入 nihao"
expect = "候选窗显示在 Spotlight 输入框下方，未被遮挡"

[[check]]
app = "密码框"
steps = "在任一网页的密码框中输入几个字母"
expect = "不显示候选窗，字母直接输入（系统在密码框中会临时停用输入法）"

[[check]]
app = "屏幕边缘、多显示器、全屏"
steps = "将输入光标置于屏幕最下方后输入；再分别在副屏和全屏 App 中各输入一次"
expect = "下方空间不足时候选窗显示在输入行上方，且不超出屏幕；候选窗始终位于光标所在的屏幕"

[[check]]
app = "浅色 / 深色模式"
steps = "分别在浅色和深色模式下输入 nihao"
expect = "候选窗和设置窗口的文字清晰；菜单栏的 Kyme 图标在两种模式下均清晰可辨，边缘平滑无锯齿（内置屏和外接屏均需检查）"

[[check]]
app = "中英切换提示"
steps = "轻按一次 Shift 后立即输入几个字母；再轻按一次 Shift"
expect = "光标旁依次显示「英」「中」，继续输入时不消失，约 1.5 秒后收起；中英状态随之切换"

[[check]]
app = "设置窗口"
steps = "点击菜单栏的输入法图标，选择「Kyme 设置…」；依次点击左侧导航栏各项；在「输入」页将每页候选数改为 10，在「外观」页将高亮色选为绿色、调大字号；回到备忘录输入 ni 后按 0。设置窗口打开时从 Spotlight 打开 Kyme，最后按 ⌘W"
expect = "设置窗口显示在最前面，各页内容完整，超出部分可滚动；预览随设置变化；备忘录中每页 10 个候选，按 0 选中第 10 个，高亮为绿色，字号变大；从 Spotlight 打开时只将设置窗口调到前面，不重复打开；⌘W 关闭窗口；settings.toml 中的注释保留"

[[check]]
app = "设置文件"
steps = "将 ~/Library/Application Support/Kyme/settings.toml 的 page_size 改为 6，保存后切换输入框并输入 ni；再使文件格式出错（如删除一个 ]）后打开设置窗口"
expect = "候选变为每页 6 个；文件出错时设置窗口标题下方以红字指出出错的行，点击选项不会覆盖文件；改回后恢复正常"

[[check]]
app = "选词记忆"
steps = "在备忘录中输入 ji，选择第 5 个候选，重复 3 次后再输入 ji；输入 nihao，先选「拟」再选「号」，然后再输入 nihao；最后在设置窗口点击「清除」和「确认清除」，回到备忘录再输入 ji"
expect = "第 5 个候选升至首位；「拟号」出现在 nihao 的候选中；清除后恢复原有顺序"

[[check]]
app = "自定义词库"
steps = "在设置窗口打开「自定义词库」，在输入框中用 Kyme 输入「鲲鹏」后按回车，再输入「曾小贤 zengxiaoxian」并点击「添加」；回到备忘录输入 kunpeng、zengxiaoxian、kp；再回到设置窗口删除「鲲鹏」，回到备忘录再输入 kunpeng"
expect = "输入框中可正常组字、选字；新添加的词条显示在列表顶部，读音分别为 kun peng、zeng xiao xian；三种输入均能打出所添加的词；删除后输入 kunpeng 不再出现「鲲鹏」"

[[check]]
app = "外部词库"
steps = "在设置窗口的「外部词库」页点击「导入…」，选择一个搜狗细胞词库（.scel）；回到备忘录输入其中一个生僻词；再回到设置窗口点击该词库的「删除」和「确认删除」，回到备忘录再输入一次"
expect = "列表中出现该词库及词数；生僻词可以打出；删除后列表中不再显示该词库，该词也无法打出"

[[check]]
app = "AI 预测选词"
steps = "在设置窗口的「AI」页选择服务商、填写 Key，点击「测试连接」，再开启「AI 预测选词」；在备忘录中先输入「周末想去夜市吃点」，再输入 meishi 并停顿；重复一次，这次在 ✨ 出现后立即按空格；新建一条空白备忘录，输入 nihao 并停顿；最后在「AI」页将「预测延迟」设为 0.5 秒，再输入一次"
expect = "「测试连接」显示通过；停顿后半秒内首选变为「✨美食」，原首选「没事」排第二，按空格上屏「美食」；✨ 出现后立即按空格时上屏原首选；空白备忘录中首选「你好」也标有 ✨；预测延迟设为 0.5 秒后 ✨ 出现明显变晚；关闭 AI 预测选词后不再出现 ✨"

[[check]]
app = "熄屏唤醒"
steps = "Kyme 为当前输入法时让屏幕熄灭并锁屏，唤醒并解锁后直接在备忘录中输入，再轻按一次 Shift"
expect = "无需任何点击即可输入，Shift 可切换中英"

[[check]]
app = "扩展词库"
steps = "在设置窗口「外部词库」页下载腾讯词库，完成后切换输入框并等待约 2 秒，输入 zhinifa；再删除腾讯词库，切换输入框后输入 zhinifa"
expect = "下载时显示进度，完成后开关自动打开；首选为「止逆阀」，删除后不再出现；日志中有「扩展词库载入」一行，打字过程中无卡顿"
