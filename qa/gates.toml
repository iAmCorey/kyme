# 发版门槛，cargo xtask qa 按这里的数字判断通过与否。
# 目标来自 docs/PLAN.md（按键 p95 < 16ms、常驻内存 < 150MB），其余按 2026-10 在 M1 Pro 上测到的值留了余量。
# 耗时和机器有关，以发版用的那台机器为准。

[engine]
# 评测集里单条拼音转换的最长耗时（毫秒）。当时约 1.5ms
max_convert_ms = 5.0
# 载入全部词库的耗时（毫秒）。当时约 160ms
max_load_ms = 500.0
# 最常用的 80 个音节两两拼接（6400 个输入），逐个字母打下去，拼音被纠错改掉的输入最多占多少（%）。
# 当时是 0.125%（剩下的是 ow→wo「我」这种纠错明显更合理的）；把没打完的音节从宽纠错时会涨到 3%
max_altered_percent = 0.5

[macos]
# 处理一个按键的耗时（输入会话、macOS 接入代码、更新候选窗，不含系统转发按键的开销）的 p95（毫秒）。
# PLAN 里在真实输入法里测到 p95 约 9ms
max_key_p95_ms = 16.0
# 输入法进程（自测模式，同样载入全部词库和候选窗）的常驻内存（MB）。当时约 120MB
max_rss_mb = 150.0
